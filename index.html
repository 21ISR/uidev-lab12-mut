<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <header>
            <H1>Student Login</H1>
            <p class="p">Access your student account</p>
        </header>
        <section>
            <label>Email or Student ID</label>
            <input class="pole" type="text" placeholder="Enter your email or student ID"/>
        </section>
        <section>
            <label>Password</label>
            <input class="pole" type="text" placeholder="Enter your password"/>
        </section>
        <section id="password-helper">
            <input class="checkbox" type="checkbox" name="Remember me" id="checkbox">
            <label for="checkbox">Remember me</label>
            <a class="ssil" href="">Forgot password?</a>
        </section>
    
        <section>
            <button>Log in</button>
        </section>
        <p class="OR">OR</p>
        <div class="left-line"></div>
        <div class="right-line"></div>
        <section  class="logo">
           <div class="oval"><img src="logo/google-dark-logo.svg" alt=""></div> 
           <div class="oval">
            <svg width="20px" height="20px" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid">
                <title>Windows</title>
                <g>
                    <path d="M0,2.84217094e-14 L121.32899,2.84217094e-14 L121.32899,121.32899 L0,121.32899 L0,2.84217094e-14 Z M134.67101,2.84217094e-14 L256,2.84217094e-14 L256,121.32899 L134.67101,121.32899 L134.67101,2.84217094e-14 Z M0,134.67101 L121.32899,134.67101 L121.32899,256 L0,256 L0,134.67101 Z M134.67101,134.67101 L256,134.67101 L256,256 L134.67101,256 L134.67101,134.67101 Z" fill="#000"/>
                </g>
            </svg>
           </div> 
           <div class="oval"><img class="apple" src="logo/apple-dark-logo.svg" alt=""></div> 
        </section>
        <section class="Registration">
            <label for="microsofttvar">Don't have an account?</label>
            <a id="microsofttvar" href="reister.html">Register</a>
        </section>
    </div>
</body>
</html>
