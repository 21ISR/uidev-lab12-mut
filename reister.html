<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <header>
            <H1>Student Registration</H1>
            <p class="p">Create your student account</p>
        </header>


        <section>
            <label>Full Name</label>
            <input class="pole" type="text" placeholder="Enter your full name"/>
        </section>
        <section>
            <label>Email Address</label>
            <input class="pole" type="text" placeholder="Enter your email"/>
        </section>
        <section>
            <label>Student ID</label>
            <input class="pole" type="text" placeholder="Enter your student ID"/>
        </section>
        <section>
            <label>Select Programm</label>
            <select class="drop" name="kategorii" id="kategorii-select">
              <option value="">Computer Science</option>
              <option value="">Engineering</option>
              <option value="">Business</option>
              <option value="">Arts & Humanities</option>
              <option value="">Science</option>
            </select>
        </section>
        <section>
            <label>Password</label>
            <input class="pole" type="text" placeholder="Create a password"/>
        </section>
        <section>
            <label>Confirm Password</label>
            <input class="pole" type="text" placeholder="Confirm your password"/>
        </section>


        <section id="password-helper">
            <input class="checkbox" type="checkbox" name="Remember me" id="checkbox">
            <label for="checkbox">I agree to the Terms of Service and Privacy Policy</label>
        </section>
    
        <section>
            <button>Log in</button>
        </section>
        <section class="Registration">
            <label for="microsofttvar">Already have an account?</label>
            <a id="microsofttvar" href="index.html">Log in</a>
        </section>
    </div>
</body>
</html>
